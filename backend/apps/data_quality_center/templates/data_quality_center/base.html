<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Data Quality Center{% endblock %}</title>
  <style>
    :root { color-scheme: light dark; }
    body { font: 14px/1.6 system-ui, sans-serif; margin: 0; background: #f6f6f4; color: #1a1a1a; }
    header { background: #0F5C52; color: #fff; padding: 12px 20px; display: flex; gap: 20px; align-items: baseline; }
    header a { color: #cdeee6; text-decoration: none; }
    header h1 { font-size: 15px; margin: 0; }
    main { max-width: 960px; margin: 0 auto; padding: 20px; }
    table { border-collapse: collapse; width: 100%; background: #fff; }
    th, td { border: 1px solid #e2e2dd; padding: 8px 10px; text-align: start; vertical-align: top; }
    th { background: #f0efe9; }
    input[type=text], textarea { width: 100%; box-sizing: border-box; font: inherit; padding: 6px; }
    textarea[dir=rtl] { direction: rtl; }
    button { font: inherit; padding: 6px 14px; background: #0F5C52; color: #fff; border: 0; border-radius: 6px; cursor: pointer; }
    .msg { padding: 8px 12px; border-radius: 6px; margin-bottom: 12px; }
    .msg.success { background: #e2f3ec; } .msg.error { background: #fbe4de; } .msg.info { background: #eef1f4; }
    .muted { color: #6b6b66; } .pill { background: #eee; border-radius: 999px; padding: 1px 8px; font-size: 12px; }
    .section { background: #fff; border: 1px solid #e2e2dd; border-radius: 8px; padding: 14px; margin-bottom: 14px; }
    .raw { white-space: pre-wrap; background: #faf9f5; border: 1px dashed #ddd; padding: 8px; max-height: 160px; overflow: auto; font-size: 13px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    nav.pager a { margin-inline-end: 8px; }
  </style>
</head>
<body>
  <header>
    <h1>Data Quality Center</h1>
    <a href="{% url 'data_quality_center:ingredient_list' %}">Ingredients</a>
    <a href="{% url 'data_quality_center:edit_history' %}">Edit history</a>
    <a href="/admin/" style="margin-inline-start:auto">Admin</a>
  </header>
  <main>
    {% for message in messages %}
      <div class="msg {{ message.tags }}">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
