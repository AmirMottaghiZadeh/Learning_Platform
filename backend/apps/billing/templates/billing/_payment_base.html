{% load static billing_extras %}<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#F7FBF9">
  <title>{% block title %}{% endblock %} · فارمنتا</title>
  <style>
    @font-face { font-family: "Vazirmatn"; font-weight: 400; font-display: swap; src: url("{% static 'website/fonts/Vazirmatn_400Regular.ttf' %}") format("truetype"); }
    @font-face { font-family: "Vazirmatn"; font-weight: 700; font-display: swap; src: url("{% static 'website/fonts/Vazirmatn_700Bold.ttf' %}") format("truetype"); }
    @font-face { font-family: "Vazirmatn"; font-weight: 900; font-display: swap; src: url("{% static 'website/fonts/Vazirmatn_900Black.ttf' %}") format("truetype"); }
    :root {
      --bg: #F7FBF9; --card: rgba(255,255,255,.86); --ink: #0F1F1B; --muted: #4D615C; --line: #DCEBE6;
      --p: #0F5C52; --onp: #FFFFFF; --tint: #E1F1EC; --soft: #EEF6F3;
      --bad: #B23A2A; --bad-tint: #FCEDEA; --warn: #8A5A00; --warn-tint: #FDF3DC;
      --aur1: #9BE3C8; --aur2: #5BC7B0; --aur3: #F2D58A; --aur-o: .55;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100dvh; background: var(--bg); color: var(--ink); font-family: "Vazirmatn", Tahoma, sans-serif; display: flex; align-items: center; justify-content: center; padding: 32px 16px; position: relative; overflow-x: hidden; }
    .aur { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
    .aur i { position: absolute; border-radius: 50%; filter: blur(70px); opacity: var(--aur-o); animation: drift 18s ease-in-out infinite alternate; }
    .aur i:nth-child(1) { width: 460px; height: 460px; background: var(--aur1); top: -120px; inset-inline-start: -120px; }
    .aur i:nth-child(2) { width: 380px; height: 380px; background: var(--aur2); bottom: -140px; inset-inline-end: -80px; animation-delay: -6s; }
    .aur i:nth-child(3) { width: 300px; height: 300px; background: var(--aur3); top: 40%; inset-inline-start: 45%; animation-delay: -12s; }
    body.failed .aur i:nth-child(3) { background: var(--bad); opacity: .14; }
    @keyframes drift { to { transform: translate(40px, 30px) scale(1.08); } }
    main { position: relative; z-index: 1; width: 100%; max-width: 460px; background: var(--card); border: 1px solid var(--line); border-radius: 32px; padding: 36px 28px 28px; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); box-shadow: 0 40px 80px -48px rgba(15,60,52,.55); animation: rise .6s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes rise { from { opacity: 0; transform: translateY(24px); } }
    .logo { display: flex; align-items: center; gap: 8px; font-weight: 900; font-size: 18px; color: var(--ink); text-decoration: none; margin-bottom: 6px; }
    .logo i { width: 34px; height: 34px; border-radius: 11px; background: var(--p); color: var(--onp); display: grid; place-items: center; font-style: normal; font-size: 15px; }
    .badge { width: 84px; height: 84px; border-radius: 50%; display: grid; place-items: center; animation: pop .5s .15s cubic-bezier(.2,1.4,.4,1) both; }
    @keyframes pop { from { transform: scale(.4); opacity: 0; } }
    .badge svg { width: 38px; height: 38px; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
    .badge.ok { background: var(--tint); color: var(--p); }
    .badge.ok svg path { stroke-dasharray: 30; stroke-dashoffset: 30; animation: draw .5s .45s ease-out forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .badge.bad { background: var(--bad-tint); color: var(--bad); }
    .badge.wait { background: var(--warn-tint); color: var(--warn); }
    h1 { margin: 4px 0 0; font-size: 25px; font-weight: 900; }
    p { margin: 0; color: var(--muted); line-height: 1.9; font-size: 15px; }
    .why { width: 100%; padding: 12px 14px; border-radius: 16px; background: var(--bad-tint); color: var(--ink); font-size: 14px; line-height: 1.9; }
    .why.wait { background: var(--warn-tint); }
    dl { width: 100%; margin: 6px 0 0; display: grid; grid-template-columns: auto 1fr; border: 1px solid var(--line); border-radius: 18px; overflow: hidden; text-align: right; font-size: 14px; }
    dt, dd { margin: 0; padding: 11px 14px; border-bottom: 1px solid var(--line); }
    dt { color: var(--muted); background: var(--soft); }
    dd { font-weight: 700; }
    dl > :nth-last-child(-n+2) { border-bottom: 0; }
    .ltr { direction: ltr; text-align: right; unicode-bidi: plaintext; }
    .acts { width: 100%; display: grid; gap: 10px; margin-top: 8px; }
    .btn { height: 52px; border-radius: 16px; font: inherit; font-weight: 700; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; border: 1.5px solid var(--line); color: var(--ink); background: transparent; transition: transform .2s, border-color .2s; }
    .btn:hover { transform: translateY(-2px); border-color: var(--p); }
    .btn.p { background: var(--p); color: var(--onp); border-color: var(--p); }
    .btn:focus-visible { outline: 3px solid var(--aur2); outline-offset: 2px; }
    .note { font-size: 13px; }
    .note a { color: var(--p); font-weight: 700; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } .badge.ok svg path { stroke-dashoffset: 0; } }
  </style>
</head>
<body class="{% block body_class %}{% endblock %}">
  <div class="aur" aria-hidden="true"><i></i><i></i><i></i></div>
  <main>
    <a class="logo" href="{{ site_url }}/"><i>P</i>فارمنتا</a>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
