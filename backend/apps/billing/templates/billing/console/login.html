{% load static %}<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>ورود · پنل مدیریت فارمنتا</title>
  <style>
    @font-face { font-family: "Vazirmatn"; font-weight: 400; font-display: swap; src: url("{% static 'dqc/fonts/Vazirmatn_400Regular.ttf' %}") format("truetype"); }
    @font-face { font-family: "Vazirmatn"; font-weight: 800; font-display: swap; src: url("{% static 'dqc/fonts/Vazirmatn_800ExtraBold.ttf' %}") format("truetype"); }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; background: #14201D; color: #14201D; font: 400 14px/1.6 "Vazirmatn", Tahoma, sans-serif; }
    form { width: 100%; max-width: 380px; background: #EFECE4; border-radius: 28px; padding: 32px 26px; display: flex; flex-direction: column; gap: 14px; }
    h1 { margin: 0; font-size: 24px; font-weight: 800; }
    p { margin: 0; color: #5F6B68; font-weight: 600; }
    label { font-size: 12.5px; font-weight: 800; color: #5F6B68; }
    input { width: 100%; min-height: 46px; border-radius: 12px; border: 1px solid #E0DBD1; background: #FFFFFF; padding: 0 12px; font: inherit; }
    button { min-height: 48px; border: 0; border-radius: 14px; background: #0F5C52; color: #FFFFFF; font: inherit; font-weight: 800; cursor: pointer; }
    :focus-visible { outline: 3px solid #9DD4B8; outline-offset: 2px; }
    .error { padding: 10px 14px; border-radius: 12px; background: #FFF1EE; color: #93331F; font-weight: 800; }
  </style>
</head>
<body>
  <form method="post">
    {% csrf_token %}
    <h1>پنل مدیریت فارمنتا</h1>
    <p>فقط حساب‌های سوپریوزر.</p>
    {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
    <input type="hidden" name="next" value="{{ next }}">
    <div><label for="username">نام کاربری</label><input id="username" name="username" value="{{ username }}" autocomplete="username" dir="ltr" required></div>
    <div><label for="password">رمز</label><input id="password" name="password" type="password" autocomplete="current-password" dir="ltr" required></div>
    <button type="submit">ورود</button>
  </form>
</body>
</html>
