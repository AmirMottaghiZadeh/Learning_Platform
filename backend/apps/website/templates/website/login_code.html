{% extends "website/base.html" %}
{% block content %}
<div class="wrap"><div class="center-card auth-card">
  <h1>تأیید شمارهٔ موبایل</h1>
  <p class="sub">کد {{ code_length }} رقمی پیامک‌شده به <b dir="ltr">{{ phone }}</b> را وارد کنید.</p>
  <form method="post" class="auth-form auth-code">
    {% csrf_token %}
    {% include "website/_auth_fields.html" %}
    <button class="btn p block" type="submit">تأیید و ادامه</button>
  </form>
  <div class="auth-actions">
    <a href="{% url 'site:login' %}?mode={{ mode }}&amp;next={{ next|urlencode }}">تغییر شماره</a>
    <form method="post">
      {% csrf_token %}
      <button class="auth-resend" type="submit" name="action" value="resend" data-resend-wait="{{ resend_in }}">ارسال دوبارهٔ کد</button>
    </form>
  </div>
  <p class="auth-link"><a href="{% url 'site:login' %}?mode=login&amp;next={{ next|urlencode }}">بازگشت به ورود</a></p>
</div></div>
{% endblock %}
