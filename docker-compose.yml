x-backend-env: &backend-env
  DJANGO_SETTINGS_MODULE: config.settings.production
  ENVIRONMENT: docker
  SECRET_KEY: ${SECRET_KEY:?Set a strong SECRET_KEY with at least 50 characters in the root .env file}
  DEBUG: "False"
  DATABASE_URL: postgresql://pharmexa:pharmexa_local_password@db:5432/pharmexa
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_TASK_ALWAYS_EAGER: "False"
  ALLOWED_HOSTS: localhost,127.0.0.1,backend
  CSRF_TRUSTED_ORIGINS: http://localhost:8000,http://127.0.0.1:8000
  CORS_ALLOWED_ORIGINS: http://localhost:8081,http://127.0.0.1:8081
  SECURE_SSL_REDIRECT: "False"
  SECURE_HSTS_SECONDS: "0"
  DATA_QUALITY_CENTER_ENABLED: "False"
  LOG_FORMAT: json

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pharmexa
      POSTGRES_USER: pharmexa
      POSTGRES_PASSWORD: pharmexa_local_password
    # Published so host tools (manage.py, import_openfda) can reach it; 5433
    # avoids clashing with a native Postgres on 5432.
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pharmexa -d pharmexa"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    # Cache eviction must never drop broker messages, so the broker uses a
    # separate logical database and the policy stays conservative.
    command: >
      redis-server --appendonly yes
                   --maxmemory 256mb
                   --maxmemory-policy volatile-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment: *backend-env
    ports:
      - "8000:8000"
    command: >
      sh -c "python manage.py migrate --no-input &&
             gunicorn config.wsgi:application --config gunicorn.conf.py"

  # Async work is currently just password-reset email. Kept so the docker path
  # exercises a real broker rather than eager execution.
  worker:
    build:
      context: ./backend
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    environment: *backend-env
    command: >
      celery -A config worker
             --loglevel=info
             --queues=default,events,maintenance
             --concurrency=2
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Expo web export served by nginx. For native (iOS/Android) use `expo start`
  # or an EAS build instead — this service is the web target only.
  frontend:
    build:
      context: ./frontend
      args:
        EXPO_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    depends_on:
      - backend
    ports:
      - "8081:80"

volumes:
  postgres_data:
  redis_data:
