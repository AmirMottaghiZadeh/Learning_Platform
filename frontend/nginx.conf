# www.pharmenta.ir -> pharmenta.ir (one canonical address for the site and PWA).
server {
    listen 80;
    server_name www.pharmenta.ir;
    return 301 https://pharmenta.ir$request_uri;
}

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Expo web is a single-page bundle: fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The entry page and the PWA manifest must never be cached: they name the
    # current (content-hashed) bundle, so a cached copy keeps loading the old
    # app after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # Content-hashed files: safe to cache forever.
    location /_expo/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;
    gzip_min_length 1024;
}
