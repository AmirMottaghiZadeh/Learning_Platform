<header><h1 id="heading"></h1><p>پیش‌نمایش طراحی با دادهٔ نمونه — رنگ و فونت از سیستم طراحی فارمنتا</p></header><main class="gallery" id="gallery"></main>
<script>
const p=new URLSearchParams(location.search),kind=p.get('kind')||'home',login=p.get('mode')==='login';
const intro='<div class="row"><span class="icon">⌕</span><div class="grow"><div class="title">سرچ هوشمند</div><div class="muted">پرسش از منابع معتبر بالینی</div></div></div>';
const nav='<div class="nav"><span>⌂ خانه</span><span>▤ دارونامه</span><span>◉ پروفایل</span></div>';
const names=kind==='home'?['کارت مرجع','جست‌وجوی سریع','دعوت به گفت‌وگو']:kind==='table'?['خاکستری مایل به سبز','خاکستری با کنتراست بیشتر']:['کارت‌های کنار هم','کارت‌های ردیفی','انتخاب‌گر داخل فرم'];
document.querySelector('#heading').textContent=kind==='home'?'سه طرح کارت سرچ هوشمند در خانه':kind==='table'?'دو رنگ پیشنهادی ستون اول جدول':`سه طرح انتخاب روش ${login?'ورود':'ثبت‌نام'}`;
document.body.classList.toggle('table-page',kind==='table');
for(let v=1;v<=(kind==='table'?2:3);v++){
 let body='';
 if(kind==='home'){
 const card=v===1?`<div class="card homecard"><div class="row"><span class="icon">⌕</span><div class="grow"><div class="title">سرچ هوشمند</div><div class="muted">پاسخ همراه متن اصلی منبع</div></div><span class="arrow">‹</span></div></div>`:v===2?`<div class="card homecard v2">${intro}<div class="search">سؤال بالینی خود را بپرسید… <span style="float:left;color:#0f5c52">←</span></div></div>`:`<div class="card homecard v3"><div class="intro"><span class="pill">با ارجاع به منبع</span><div class="title" style="margin-top:8px">پرسش شما، پاسخ مستند</div><div class="muted">سرچ هوشمند در منابع بالینی</div></div><div class="footer"><span>شروع گفت‌وگو</span><span>←</span></div></div>`;
 body=`<div class="top"><small>فارمنتا</small><b>امروز، یک قدم جلوتر</b></div><div class="content">${card}<div class="card row"><div class="icon">U</div><div class="grow"><b>UpToDate</b><p class="muted">ورود به پایگاه دادهٔ بالینی</p></div><span class="arrow">‹</span></div><div class="card row"><div class="icon">L</div><div class="grow"><b>LexiComp</b><p class="muted">بررسی تداخل‌های دارویی</p></div><span class="arrow">‹</span></div><div class="section">درِ ورودی مسیرها</div><div class="mini"><div>آموزش</div><div>بالینی</div></div></div>${nav}`;
 }else if(kind==='table'){
 body=`<div class="top"><small>خوانندهٔ UpToDate</small><b>نمایش جدول با مرزبندی کامل سلول‌ها</b></div><div class="content" style="--first:${v===1?'#e3e8e1':'#d4dcd3'}"><table><tr><th>Category</th><th>Description</th><th>Notes</th></tr><tr><td>Assessment</td><td>Source table content</td><td rowspan="2">Merged source cell</td></tr><tr><td>Management</td><td>Original text</td></tr><tr><td>Follow-up</td><td colspan="2">A source cell spanning two columns</td></tr></table><p class="quiet">محتوای این جدول نمونهٔ چیدمان است و توصیهٔ درمانی نیست.</p></div><div class="note">ستون اول: <b>${v===1?'سبز خاکستری ملایم':'خاکستری سبز پررنگ‌تر'}</b><br>خطوط بین ردیف‌ها، ستون‌ها و سلول‌های ادغام‌شده حفظ می‌شوند.</div>`;
 }else{
 const methods=`<div class="methods"><div class="method on">${v===2?'<span class="radio">✓</span><div>':'☎'}<b>شمارهٔ موبایل</b>${v===2?'<p>روش پیش‌فرض · دریافت کد پیامکی</p></div>':''}</div><div class="method">${v===2?'<span class="radio"></span><div>':'✉'}<b>ایمیل</b>${v===2?'<p>دریافت کد ورود در ایمیل</p></div>':''}</div></div>`;
 const form=`<label>شمارهٔ موبایل</label><div class="input" style="direction:ltr;text-align:right">09xxxxxxxxx</div>${login?'<label>رمز عبور</label><div class="input">••••••••</div>':''}<div class="btn">${login?'ورود به حساب':'دریافت کد تأیید'}</div><p class="quiet" style="text-align:center">${login?'رمز عبورت را فراموش کرده‌ای؟':'با ادامه، قوانین و حریم خصوصی فارمنتا را می‌پذیرید.'}</p>`;
 body=`<div class="top"><div class="brand"><img src="../../../frontend/assets/icons/app-logo.png"></div><b>فارمنتا</b><small>یادگیری هوشمند دارویی</small></div><div class="content"><h2>${login?'ورود به حساب':'ساخت حساب کاربری'}</h2><p class="muted">روش ${login?'ورود':'ثبت‌نام'} را انتخاب کنید؛ موبایل به‌صورت پیش‌فرض فعال است.</p>${v===3?'<div class="panel" style="margin-top:16px">':''}${methods}${form}${v===3?'</div>':''}<div class="other">${login?'حساب نداری؟ ثبت‌نام کن':'قبلاً ثبت‌نام کرده‌ای؟ وارد شو'}</div></div>`;
 }
 document.querySelector('#gallery').insertAdjacentHTML('beforeend',`<section class="sample"><div class="label">مدل ${v} — ${names[v-1]}</div><div class="phone ${kind==='home'?'':kind==='table'?'':'auth '+(v===2?'vertical':v===3?'tabs':'')}" >${body}</div></section>`);
}
</script></html>
