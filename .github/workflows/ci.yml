name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pharmexa
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pharmexa"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      SECRET_KEY: Ci2026!Atlas_River+Quartz%Nimbus7Orbit9Harbor3Saffron5
      DEBUG: "False"
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/pharmexa
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/1
      CELERY_TASK_ALWAYS_EAGER: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CSRF_TRUSTED_ORIGINS: http://localhost:8000
      CORS_ALLOWED_ORIGINS: http://localhost:8081
      ENVIRONMENT: ci
      LOG_FORMAT: json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python manage.py check
      # The production guard rejects an in-request task runner, so this step
      # must exercise the real broker configuration.
      - run: python manage.py check --deploy --settings=config.settings.production
        env:
          CELERY_TASK_ALWAYS_EAGER: "False"
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py backup_database --dry-run
      # --verbosity=2 prints each test name before it runs, so a hang's last log
      # line names the culprit; --timing flags a slow test.
      - run: python manage.py test --verbosity=2 --timing
        timeout-minutes: 10

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:web
